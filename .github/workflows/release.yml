name: Release

# Triggered by pushing a tag like "v1.0.0". Builds the app, runs the full test
# suite first (a broken build never gets published), signs the release APK if
# signing secrets are configured (see README "Release-Signing einrichten"), and
# attaches the APK to a GitHub Release for that tag.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.0.0). Must already exist.'
        required: true

permissions:
  contents: write

jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Run full test suite
        run: ./gradlew test testDebugUnitTest --console=plain

      # The `secrets` context can't be used directly in `if:` conditions (GitHub
      # Actions only allows it in `env:`/`with:`), so resolve it into a step output
      # first and branch on that everywhere else below.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "has_secrets=${{ secrets.KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: steps.signing.outputs.has_secrets == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore.jks"

      - name: Build signed release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.has_secrets == 'true' && format('{0}/release.keystore.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Warn if the APK is only debug-signed
        if: steps.signing.outputs.has_secrets != 'true'
        run: |
          echo "::warning::No KEYSTORE_BASE64 secret configured - this release APK is signed with the debug keystore, not a real upload key. See README for how to set up release signing."

      - name: Collect and rename artifact
        run: |
          mkdir -p release-artifacts
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          cp "$apk" "release-artifacts/NfcEmu-${{ steps.version.outputs.tag }}.apk"
          # Fixed-name copy so /releases/latest/download/NfcEmu-latest.apk always
          # resolves to whichever release GitHub currently considers "latest" -
          # a stable link that never changes between versions.
          cp "$apk" "release-artifacts/NfcEmu-latest.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: release-artifacts/*.apk
          generate_release_notes: true
          draft: false
          make_latest: true
